name: CI

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  single-job-test:
    name: Test single job
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: .github/actions/gha-jobid-action
      - name: Run action with options
        id: test1
        uses: ./.github/actions/gha-jobid-action
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "Test single job"
          repository: "step-security/gha-jobid-action"
          run_id: "29311401059"
      - name: Verify
        run: |
          check_url() {
            if [[ "$1" == "$2" ]]; then
              echo "html_url OK"
            else
              echo "html_url ERROR" >&2
              ERROR_FLAG=1
            fi
          }
          check_job_id() {
            if [[ "$1" == "$2" ]]; then
              echo "job_id OK"
            else
              echo "job_id ERROR" >&2
              ERROR_FLAG=1
            fi
          }
          ERROR_FLAG=0
          check_url "${{ steps.test1.outputs.html_url }}" "https://github.com/step-security/gha-jobid-action/actions/runs/29311401059/job/87015720104"
          check_job_id "${{ steps.test1.outputs.job_id }}" "87015720104"
          if [[ "$ERROR_FLAG" == 1 ]]; then
            exit 1
          fi

  single-job-test-default-repo-token:
    name: Test single job with default repo and token
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
