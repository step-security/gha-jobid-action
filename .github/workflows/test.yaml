          job_name: "Test single job"
          run_id: "29311401059"
      - name: Verify
        run: |
          check_url() {
            if [[ "$1" == "$2" ]]; then
              echo "html_url OK"
            else
              echo "html_url ERROR" >&2
              ERROR_FLAG=1
            fi
          }
          check_job_id() {
            if [[ "$1" == "$2" ]]; then
